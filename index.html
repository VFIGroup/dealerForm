<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto-Location Form Redirect</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    .info {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>Getting Your Location...</h1>
  <p class="info" id="status">Please wait while we detect your location.</p>

  <script>
    
    const formBaseUrl = "https://docs.google.com/forms/d/e/1FAIpQLSeRvzj01JtZiMZFDuzjmvvvv_b4uwDCKYTpT6TIpkbzgdbXXA/viewform";
    
    
    const lngField = "entry.928419986";   // Longitude
    const latField = "entry.1353621841";  // Latitude

    function redirectToForm(lat, lng) {
      const filledUrl = `${formBaseUrl}?usp=pp_url&${lngField}=${lng}&${latField}=${lat}`;
      document.getElementById("status").textContent = "Redirecting you to the form...";
      window.location.href = filledUrl;
    }

    function handleError(error) {
      document.getElementById("status").textContent = "Could not detect your location. Please enable GPS or allow location access.";
    }

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const lat = position.coords.latitude.toFixed(6);
          const lng = position.coords.longitude.toFixed(6);
          redirectToForm(lat, lng);
        }, handleError);
      } else {
        document.getElementById("status").textContent = "Geolocation is not supported by your browser.";
      }
    }

    getLocation();
  </script>

</body>
</html>
